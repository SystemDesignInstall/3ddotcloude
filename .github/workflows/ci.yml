name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: architecture validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout governance
        uses: actions/checkout@v4
        with:
          repository: SystemDesignInstall/spatial-rfcs
          path: _governance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Governance validation
        run: python scripts/check_rfc.py --rfcs _governance
      - name: Constitution change control
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_TITLE: ${{ github.event.pull_request.title }}
          CHANGE_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          base = os.environ.get("CHANGE_BASE", "")
          if base and set(base) == {"0"}:
              base = ""
          revision = f"{base}..HEAD" if base else "HEAD"
          messages = subprocess.check_output(
              ["git", "log", "--format=%B", revision], text=True
          )
          description = "\n".join([
              os.environ.get("CHANGE_TITLE", ""),
              os.environ.get("CHANGE_BODY", ""), messages
          ])
          match = re.search(r"\bRFC-\d{4}\b", description)
          command = [sys.executable, "scripts/check_constitution.py",
                     "--repo", ".", "--rfcs", "_governance"]
          if base:
              command += ["--base", base]
          if match:
              command += ["--rfc", match.group()]
          subprocess.run(command, check=True)
          PY
      - name: Domain types
        run: python scripts/check_domain_types.py
      - name: Worker boundary
        run: python scripts/check_worker_boundary.py
      - name: Architecture debt
        run: python scripts/check_arch_debt.py
      - name: Dependency registry
        run: python scripts/check_dependencies.py
      - name: Schema validation
        run: python scripts/check_schemas.py

  build:
    name: build (${{ matrix.os }} / ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: Debug
            preset: linux-debug
            host_profile: linux-gcc13-debug
            build_profile: linux-gcc13
            conan_output: conan-linux-debug
          - os: ubuntu-24.04
            config: Release
            preset: linux-release
            host_profile: linux-gcc13
            build_profile: linux-gcc13
            conan_output: conan-linux-release
          - os: windows-2022
            config: Debug
            preset: default
            host_profile: msvc2022-x64-debug
            build_profile: msvc2022-x64
            conan_output: conan-debug
          - os: windows-2022
            config: Release
            preset: release
            host_profile: msvc2022-x64
            build_profile: msvc2022-x64
            conan_output: conan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install conan==2.33.0 cmake==4.4.4 ninja==1.13.2
      - name: Restore Conan packages
        id: conan-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ matrix.config }}-${{ hashFiles('conan.lock', 'conanfile.txt', 'conan/profiles/*', 'conan/recipes/gtsam/**') }}
          restore-keys: conan-${{ matrix.os }}-${{ matrix.config }}-
      - name: Export Windows GTSAM compatibility recipe
        if: runner.os == 'Windows'
        run: conan export conan/recipes/gtsam --version=4.2.1 --user=spatial --channel=compat
      - name: Install locked dependencies
        run: >-
          conan install .
          --lockfile=conan.lock
          --profile:host=conan/profiles/${{ matrix.host_profile }}
          --profile:build=conan/profiles/${{ matrix.build_profile }}
          --output-folder=build/${{ matrix.conan_output }}
          --build=missing
          --conf:all=tools.build:jobs=2
      - name: Save installed Conan packages
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.conan2/p
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2 --timeout 180
