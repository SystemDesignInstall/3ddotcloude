name: photo-cloud research checks

on:
  pull_request:
    paths:
      - 'python/research/photo_to_cloud/**'
      - '.github/workflows/photo-cloud.yml'
  push:
    branches: [main]
    paths:
      - 'python/research/photo_to_cloud/**'
      - '.github/workflows/photo-cloud.yml'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r python/research/photo_to_cloud/requirements.txt
      - run: python -m unittest discover -s python/research/photo_to_cloud -p 'test_*.py' -v
