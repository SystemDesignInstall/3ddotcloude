# THIRD_PARTY.yml - Dependency and backend registry (single source of record)
#
# ADR-003 (dependency manager) and ADR-031 (M0 scope) make this file the
# authoritative registry for every library and backend in the Spatial
# Platform. CI's `check-dependencies` gate (scripts/check_dependencies.py)
# rejects any conanfile.txt package that is not registered here and any
# `status: active` dependency whose license is not permissive/allowlisted.
#
# Field reference:
#   name             Registry key; matches the conan package name
#                    (`_` and `-` are treated as equivalent).
#   repository       Upstream source URL.
#   version          Pinned or minimum version tracked by the platform.
#   code_license     License of the code/tool itself.
#   model_license    License of any distributed model weights (null if none).
#   commercial_use   yes | no | conditional - is commercial use permitted?
#   redistribution   yes | no | conditional - may we redistribute it?
#   status           planned | active | removed.
#   notes            Registration rationale and caveats.
#   security_notes   Tracked security/CVSS considerations (null when none).
#
# Active = used by a current kernel, adapter or build-tool target. Adapter
# dependencies do not become Core dependencies. Planned = later milestone. Copyleft licenses on planned
# backends (AGPL-3.0, LGPL-2.1) are WARNINGS here: they may only enter the
# product through the separate-adapter process after legal review.
dependencies:
  - name: eigen
    repository: https://gitlab.com/libeigen/eigen
    version: "3.4"
    code_license: MPL-2.0
    model_license: null
    commercial_use: yes
    redistribution: yes
    status: active
    notes: M0 dependency (ADR-019). Header-only linear algebra; matrix types stay inside core/geometry/ and adapters/ per the domain-types gate.
    security_notes: null
  - name: protobuf
    repository: https://github.com/protocolbuffers/protobuf
    version: tracked-by-conan
    code_license: Apache-2.0
    model_license: null
    commercial_use: yes
    redistribution: yes
    status: active
    notes: M0 dependency. Cross-language worker-protocol and schema serialization (ADR-012).
    security_notes: null
  - name: sqlite3
    repository: https://www.sqlite.org/
    version: tracked-by-conan
    code_license: Public Domain
    model_license: null
    commercial_use: yes
    redistribution: yes
    status: active
    notes: M0 dependency. Metadata and indices only; payloads live in the content-addressed artifact store (ADR-008, ADR-009).
    security_notes: null
  - name: nlohmann-json
