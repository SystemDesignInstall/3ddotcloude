<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatial Photo Cloud — полное облако</title>
<style>
:root{color-scheme:dark;--bg:#101923;--panel:#192b3a;--ink:#edf4fa;--muted:#bbccda;--accent:#5ac1dd}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 20px 12px;background:var(--panel);border-bottom:1px solid #385166;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
h1{font-size:19px;margin:0 0 3px}p{margin:4px 0;color:var(--muted)}.intro{min-width:250px;flex:1}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,.upload{border:0;border-radius:6px;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer;color:#09212a;background:var(--accent)}
button.secondary{background:#29465b;color:var(--ink)}button:hover,.upload:hover{filter:brightness(1.12)}button:focus-visible,.upload:focus-within{outline:3px solid #fff;outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}input[type=range]{width:100px;vertical-align:middle;accent-color:var(--accent)}
.status{width:100%;font-variant-numeric:tabular-nums;color:#dceaf2;min-height:1.3em}.status.error{color:#ffb2ad}.status.good{color:#9be6c3}
main{height:calc(100vh - 120px);min-height:320px;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.hint{position:absolute;bottom:14px;left:16px;padding:8px 11px;background:#101923dc;border-radius:6px;color:var(--muted);pointer-events:none}
@media(max-width:800px){main{height:70vh}.hint{font-size:12px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="intro"><h1>Просмотр полного облака</h1><p>Откройте файл <b>dense.ply</b> из папки результата. Данные остаются на вашем компьютере.</p></div>
  <div class="actions">
    <label class="upload">Выбрать PLY<input id="file" type="file" accept=".ply,application/octet-stream"></label>
    <button class="secondary" id="reset" type="button">Сбросить вид</button>
    <label>Размер точек <input id="size" type="range" min="1" max="6" step="0.5" value="2"></label>
    <label>Яркость <input id="brightness" type="range" min="0.6" max="3" step="0.1" value="1.3"></label>
  </div>
  <div id="status" class="status" aria-live="polite">Выберите PLY или перетащите его в это окно.</div>
</header>
<main id="drop"><canvas id="view" aria-label="Трёхмерное облако точек"></canvas>
<div class="hint">Левая кнопка мыши — вращение · Shift + мышь — перемещение · Колесо — масштаб</div></main>
<script id="parser-worker" type="text/x-worker">
'use strict';
const types={char:[1,'getInt8'],int8:[1,'getInt8'],uchar:[1,'getUint8'],uint8:[1,'getUint8'],short:[2,'getInt16'],int16:[2,'getInt16'],ushort:[2,'getUint16'],uint16:[2,'getUint16'],int:[4,'getInt32'],int32:[4,'getInt32'],uint:[4,'getUint32'],uint32:[4,'getUint32'],float:[4,'getFloat32'],float32:[4,'getFloat32'],double:[8,'getFloat64'],float64:[8,'getFloat64']};
function headerOf(buffer){
 const bytes=new Uint8Array(buffer), cap=Math.min(bytes.length,1048576), text=new TextDecoder('latin1').decode(bytes.subarray(0,cap));
 const match=/(?:^|\n)end_header[ \t]*\r?\n/.exec(text);
 if(!match)throw Error('Заголовок PLY не найден или неполный.');
 const end=match.index+match[0].length, lines=text.slice(0,end).split(/\r?\n/);
 if(lines[0].trim()!=='ply')throw Error('Выбранный файл не является PLY.');
 let format=null, current=null, found=false, count=0, props=[], before=false;
 for(const line of lines){
  const w=line.trim().split(/\s+/);if(w[0]==='format')format=w[1];
  else if(w[0]==='element'){
   const n=Number(w[2]);if(!Number.isSafeInteger(n)||n<0)throw Error('Некорректное число элементов в PLY.');
   current=w[1];if(current==='vertex'){if(found)throw Error('В PLY несколько разделов vertex.');found=true;count=n;}
   else if(!found&&n>0)before=true;
  }else if(w[0]==='property'&&current==='vertex'){
   if(w[1]==='list'){
    if(!types[w[2]]||!types[w[3]]||!/^u?(?:char|short|int|int8|int16|int32|8|16|32)$/.test(w[2]))throw Error('Неподдерживаемый тип списка PLY.');
    props.push({name:w[4],type:w[3],countType:w[2],list:true});
   }else{if(!types[w[1]])throw Error('Неподдерживаемый тип свойства PLY: '+w[1]);props.push({name:w[2],type:w[1],list:false});}
  }
 }
 if(before)throw Error('В PLY есть данные перед точками; откройте файл через CloudCompare и сохраните как PLY.');
 if(!found||!count||!['x','y','z'].every(k=>props.some(p=>p.name===k&&!p.list)))throw Error('В файле не найдены координаты точек x, y, z.');
 if(!['ascii','binary_little_endian','binary_big_endian'].includes(format))throw Error('Неподдерживаемый формат PLY: '+format);
 return {end,format,count,props};
}
function colorByte(value,type){if(!Number.isFinite(value))return 180;if((type==='float'||type==='float32'||type==='double'||type==='float64')&&value>=0&&value<=1)value*=255;else if((type==='ushort'||type==='uint16')&&value>255)value/=257;return Math.max(0,Math.min(255,Math.round(value)));}
async function parse(file){
 self.postMessage({type:'progress',text:'Чтение файла…'});const buffer=await file.arrayBuffer(),h=headerOf(buffer),dv=new DataView(buffer),bytes=new Uint8Array(buffer),le=h.format!=='binary_big_endian';
 const propIndex=Object.fromEntries(h.props.map((p,i)=>[p.name,i]));
 const select=(...names)=>names.map(n=>propIndex[n]).find(i=>i!==undefined);
 const xi=select('x'),yi=select('y'),zi=select('z'),ri=select('red','r','diffuse_red'),gi=select('green','g','diffuse_green'),bi=select('blue','b','diffuse_blue');
 const rgbIndices=[ri,gi,bi], coordinates=new Float64Array(h.count*3),colors=new Uint8Array(h.count*3);
 let min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity],valid=0,pos=h.end;
 function readScalar(offset,type){const t=types[type];if(offset<0||offset+t[0]>dv.byteLength)throw Error('Файл PLY обрезан в данных точек.');return dv[t[1]](offset,le);}
 function store(x,y,z,r,g,b){if(!Number.isFinite(x)||!Number.isFinite(y)||!Number.isFinite(z))return;const o=valid*3;coordinates[o]=x;coordinates[o+1]=y;coordinates[o+2]=z;colors[o]=r;colors[o+1]=g;colors[o+2]=b;valid++;for(let k=0;k<3;k++){let v=k===0?x:k===1?y:z;if(v<min[k])min[k]=v;if(v>max[k])max[k]=v;}}
 const notifyEvery=Math.max(10000,Math.floor(h.count/80));
 if(h.format!=='ascii'&&!h.props.some(p=>p.list)){
  let stride=0,offsets=[];for(const p of h.props){offsets.push(stride);stride+=types[p.type][0];}
  if(pos+h.count*stride>dv.byteLength)throw Error('Файл PLY обрезан в данных точек.');
  for(let i=0;i<h.count;i++){
   const base=pos+i*stride,x=readScalar(base+offsets[xi],h.props[xi].type),y=readScalar(base+offsets[yi],h.props[yi].type),z=readScalar(base+offsets[zi],h.props[zi].type);
   const c=rgbIndices.map(j=>j===undefined?180:colorByte(readScalar(base+offsets[j],h.props[j].type),h.props[j].type));store(x,y,z,c[0],c[1],c[2]);
   if(i%notifyEvery===0)self.postMessage({type:'progress',text:'Загрузка точек: '+Math.floor(i/h.count*100)+'%'});
  }
 }else{
  const decoder=new TextDecoder('utf-8');
  for(let i=0;i<h.count;i++){
   let values=Object.create(null);
   if(h.format==='ascii'){
    if(pos>=bytes.length)throw Error('Файл PLY обрезан в данных точек.');let end=bytes.indexOf(10,pos);if(end<0)end=bytes.length;
    const fields=decoder.decode(bytes.subarray(pos,end)).trim().split(/\s+/);pos=end+1;let f=0;
    for(const p of h.props){if(p.list){const n=Number(fields[f++]);if(!Number.isSafeInteger(n)||n<0||f+n>fields.length)throw Error('Некорректный список в PLY.');f+=n;}else{if(f>=fields.length)throw Error('Файл PLY обрезан в данных точек.');values[p.name]=Number(fields[f++]);}}
   }else{
    for(const p of h.props){if(p.list){const n=readScalar(pos,p.countType);pos+=types[p.countType][0];const size=n*types[p.type][0];if(!Number.isSafeInteger(n)||n<0||pos+size>dv.byteLength)throw Error('Некорректный список в PLY.');pos+=size;}else{values[p.name]=readScalar(pos,p.type);pos+=types[p.type][0];}}
   }
   const c=rgbIndices.map(j=>j===undefined?180:colorByte(values[h.props[j].name],h.props[j].type));store(values.x,values.y,values.z,c[0],c[1],c[2]);
   if(i%notifyEvery===0)self.postMessage({type:'progress',text:'Загрузка точек: '+Math.floor(i/h.count*100)+'%'});
  }
 }
 if(!valid)throw Error('В PLY нет точек с корректными координатами.');
 self.postMessage({type:'progress',text:'Подготовка к отображению…'});
 const center=min.map((v,k)=>(v+max[k])/2),scale=Math.max(...max.map((v,k)=>v-min[k]))||1,positions=new Float32Array(valid*3);
 for(let i=0;i<valid;i++){for(let k=0;k<3;k++)positions[3*i+k]=(coordinates[3*i+k]-center[k])/scale;}
 const colorOut=valid===h.count?colors:colors.slice(0,valid*3);
 const extents=max.map((v,k)=>(v-min[k])/(2*scale));
 self.postMessage({type:'done',total:h.count,valid,extents,positions:positions.buffer,colors:colorOut.buffer},[positions.buffer,colorOut.buffer]);
}
self.onmessage=async e=>{try{await parse(e.data);}catch(error){self.postMessage({type:'error',text:error&&error.message?error.message:String(error)});}};
</script>
<script>
'use strict';
const canvas=document.getElementById('view'),status=document.getElementById('status'),fileInput=document.getElementById('file'),sizeInput=document.getElementById('size'),brightness=document.getElementById('brightness');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false,depth:true,preserveDrawingBuffer:false});
let program=null,posBuffer=null,colBuffer=null,count=0,extents=[.5,.5,.5],yaw=.35,pitch=-.2,zoom=1,panX=0,panY=0,drag=null,worker=null,frame=0;
function statusText(text,kind=''){status.textContent=text;status.className='status '+kind;}
function shader(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error('Ошибка WebGL: '+gl.getShaderInfoLog(sh));return sh;}
function initialize(){
 if(!gl)throw Error('WebGL недоступен в браузере. Попробуйте Microsoft Edge или Google Chrome.');
 const vs=shader(gl.VERTEX_SHADER,`attribute vec3 pos;attribute vec3 col;uniform float yaw,pitch,zoom,aspect,size,bright;uniform vec2 pan;varying vec3 color;
 void main(){float cy=cos(yaw),sy=sin(yaw),cp=cos(pitch),sp=sin(pitch);float x=cy*pos.x-sy*pos.z;float z=sy*pos.x+cy*pos.z;float y=cp*pos.y-sp*z;float depth=sp*pos.y+cp*z;
 vec2 ratio=aspect>=1.0?vec2(1.0/aspect,1.0):vec2(1.0,aspect);gl_Position=vec4(vec2(x,y)*ratio*zoom+pan,depth*0.8,1.0);gl_PointSize=size;color=pow(col,vec3(1.0/bright));}`);
 const fs=shader(gl.FRAGMENT_SHADER,`precision mediump float;varying vec3 color;void main(){gl_FragColor=vec4(color,1.0);}`);
 program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Ошибка WebGL: '+gl.getProgramInfoLog(program));
 gl.useProgram(program);posBuffer=gl.createBuffer();colBuffer=gl.createBuffer();gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.clearColor(0.063,0.098,0.137,1);
}
function draw(){frame=0;if(!gl||!program)return;const d=Math.min(window.devicePixelRatio||1,2),w=Math.max(1,Math.floor(canvas.clientWidth*d)),h=Math.max(1,Math.floor(canvas.clientHeight*d));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(!count)return;
 gl.useProgram(program);gl.bindBuffer(gl.ARRAY_BUFFER,posBuffer);let a=gl.getAttribLocation(program,'pos');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,colBuffer);a=gl.getAttribLocation(program,'col');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.UNSIGNED_BYTE,true,0,0);
 for(const [n,v] of [['yaw',yaw],['pitch',pitch],['zoom',zoom],['aspect',w/h],['size',Number(sizeInput.value)*d],['bright',Number(brightness.value)]])gl.uniform1f(gl.getUniformLocation(program,n),v);
 gl.uniform2f(gl.getUniformLocation(program,'pan'),panX,panY);gl.drawArrays(gl.POINTS,0,count);
}
function refresh(){if(!frame)frame=requestAnimationFrame(draw)}
function resetView(){
 yaw=.35;pitch=-.2;panX=0;panY=0;const [ex,ey,ez]=extents,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),aspect=Math.max(1,canvas.clientWidth)/Math.max(1,canvas.clientHeight);
 const x=Math.abs(cy)*ex+Math.abs(sy)*ez,y=Math.abs(cp)*ey+Math.abs(sp*sy)*ex+Math.abs(sp*cy)*ez;
 zoom=Math.min(100,.88/Math.max(1e-9,x*(aspect>=1?1/aspect:1)),.88/Math.max(1e-9,y*(aspect>=1?1:aspect)));refresh();
}
function load(file){
 if(!program)return;if(!file||!file.name.toLowerCase().endsWith('.ply')){statusText('Выберите файл с расширением .ply.','error');return;}
 if(worker)worker.terminate();count=0;refresh();statusText('Подготовка файла: '+file.name+'…');
 const code=document.getElementById('parser-worker').textContent,url=URL.createObjectURL(new Blob([code],{type:'text/javascript'})),activeWorker=new Worker(url);worker=activeWorker;URL.revokeObjectURL(url);
 activeWorker.onmessage=e=>{if(worker!==activeWorker)return;const r=e.data;if(r.type==='progress')statusText(r.text);else if(r.type==='error'){statusText(r.text,'error');activeWorker.terminate();worker=null;}else if(r.type==='done'){
  try{gl.bindBuffer(gl.ARRAY_BUFFER,posBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(r.positions),gl.STATIC_DRAW);gl.bindBuffer(gl.ARRAY_BUFFER,colBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Uint8Array(r.colors),gl.STATIC_DRAW);const error=gl.getError();if(error!==gl.NO_ERROR)throw Error('Не удалось загрузить точки в WebGL (код '+error+').');
   count=r.valid;extents=r.extents;resetView();const f=n=>new Intl.NumberFormat('ru-RU').format(n);statusText('Загружено точек: '+f(r.valid)+' из '+f(r.total)+(r.valid<r.total?' (некорректные координаты пропущены)':''),'good');
  }catch(error){statusText(error.message,'error');count=0;refresh()}activeWorker.terminate();worker=null;
 }};activeWorker.onerror=e=>{if(worker!==activeWorker)return;statusText('Ошибка чтения PLY: '+e.message,'error');activeWorker.terminate();worker=null;};activeWorker.postMessage(file);
}
try{initialize();refresh()}catch(error){statusText(error.message,'error')}
fileInput.addEventListener('change',()=>{load(fileInput.files[0]);fileInput.value=''});
document.getElementById('reset').addEventListener('click',resetView);sizeInput.addEventListener('input',refresh);brightness.addEventListener('input',refresh);
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,pan:e.shiftKey};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(drag.pan){panX+=2*dx/canvas.clientWidth;panY-=2*dy/canvas.clientHeight;}else{yaw+=dx*.008;pitch+=dy*.008;}drag.x=e.clientX;drag.y=e.clientY;refresh()});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.1,Math.min(100,zoom*Math.exp(-e.deltaY*.001)));refresh()},{passive:false});
for(const event of ['dragenter','dragover'])document.addEventListener(event,e=>{e.preventDefault();});document.addEventListener('drop',e=>{e.preventDefault();load(e.dataTransfer.files[0]);});window.addEventListener('resize',refresh);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();statusText('Браузер потерял контекст WebGL. Обновите страницу и откройте PLY снова.','error')});
</script>
</body>
</html>
