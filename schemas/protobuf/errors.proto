syntax = "proto3";

package spatial;

// Error model contract (ADR-014). Error codes are part of the public
// contract and are carried across the worker protocol boundary (never
// exceptions). See docs/architecture/error-model.md.

enum ErrorDomain {
  ERROR_DOMAIN_UNSPECIFIED = 0;
  ERROR_DOMAIN_PROJECT     = 1;
  ERROR_DOMAIN_STORAGE     = 2;
  ERROR_DOMAIN_SCHEMA      = 3;
  ERROR_DOMAIN_COORDINATE  = 4;
  ERROR_DOMAIN_CALIBRATION = 5;
  ERROR_DOMAIN_IMPORT      = 6;
  ERROR_DOMAIN_ARTIFACT    = 7;
  ERROR_DOMAIN_SCHEDULER   = 8;
  ERROR_DOMAIN_WORKER      = 9;
  ERROR_DOMAIN_ADAPTER     = 10;
  ERROR_DOMAIN_VALIDATION  = 11;
  ERROR_DOMAIN_UNKNOWN     = 12;
}

message ErrorInfo {
  string        code             = 1; // stable machine-readable code, e.g. "STORAGE_ATOMIC_WRITE_FAILED"
  string        message          = 2; // human-readable message
  string        context          = 3; // technical context
  bool          recoverable      = 4; // drives retry policy
  string        suggested_action = 5;
  string        cause_code       = 6; // chained cause, empty if none
  ErrorDomain   domain           = 7;
}

// Stable scheduler (domain 8) error codes (RFC-0003 §5.14).
enum SchedulerErrorCode {
  SCHEDULER_ERROR_UNSPECIFIED = 0;
  SCHED_DAG_CYCLE = 1;
  SCHED_DAG_TYPE_MISMATCH = 2;
  SCHED_DAG_RESOURCE_INFEASIBLE = 3;
  SCHED_TASK_UNKNOWN = 4;
  SCHED_PERSISTENCE = 5;
  SCHED_CACHE_MISS = 6;
  SCHED_CANCELLED = 7;
}

// Stable worker (domain 9) error codes (RFC-0003 §5.14).
enum WorkerErrorCode {
  WORKER_ERROR_UNSPECIFIED = 0;
  WORKER_PROTOCOL = 1;
  WORKER_HEARTBEAT_TIMEOUT = 2;
  WORKER_CRASHED = 3;
  WORKER_TERMINATED = 4;
  WORKER_BUSY = 5;
}
